name: mmi-notify-3h

# 3-hourly MMI notification during Indian market hours (09:15–15:30 IST).
# Runs at 03:45, 06:45, 09:45, 12:45 UTC (09:15, 12:15, 15:15, 18:15 IST).
# Only notifies — does NOT re-scrape. Uses latest committed data snapshot.
# If data is stale (>4h), the run exits cleanly without notifying.

on:
  schedule:
    - cron: '45 3,6,9,12 * * 1-5'   # Mon–Fri trading days, 3-hourly
  workflow_dispatch:
  repository_dispatch:
    types: [notify]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Read latest snapshot and notify (3-hourly)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_BASE_URL: ${{ secrets.NTFY_BASE_URL }}
          NTFY_USER: ${{ secrets.NTFY_USER }}
          NTFY_PASSWORD: ${{ secrets.NTFY_PASSWORD }}
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          data_dir = Path("data")
          latest_file = data_dir / "latest.json"
          if not latest_file.exists():
              print("No latest.json — nothing to notify")
              sys.exit(0)

          latest = json.loads(latest_file.read_text())
          ts = latest.get("ts") or latest.get("timestamp")
          if not ts:
              print("No timestamp in latest.json — skipping")
              sys.exit(0)

          # Staleness guard: if data > 4h old, skip silently
          try:
              dt = datetime.fromisoformat(ts.replace("Z", "+00:00"))
              age_h = (datetime.now(timezone.utc) - dt).total_seconds() / 3600
              if age_h > 4:
                  print(f"Snapshot age {age_h:.1f}h > 4h — skipping notify")
                  sys.exit(0)
          except Exception:
              pass

          # Invoke notifier with the snapshot
          from mmi_watch.notify.channels import notify_all
          from mmi_watch.models import MmiReading

          reading = MmiReading(
              value=latest["value"],
              zone=latest["zone"],
              prev=latest.get("prev"),
              week_ago=latest.get("week_ago"),
              month_ago=latest.get("month_ago"),
              year_ago=latest.get("year_ago"),
              summary=latest.get("summary"),
              ts=latest.get("ts", datetime.now(timezone.utc).isoformat()),
          )

          result = notify_all(reading, source="mmi-watch-3h")
          print(f"Notify result: {result}")
          if not any(result.values()):
              print("All channels failed or unconfigured")
              sys.exit(1)
          print("Notification sent successfully")
          PY

      - name: Notify on failure
        if: failure()
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d text="⚠️ MMI 3-hourly notify workflow failed: ${{ github.run_id }}" \
              -d parse_mode=HTML
          fi