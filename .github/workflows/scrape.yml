name: mmi-watch

# Hourly Tickertape MMI read -> classify -> commentary -> notify -> commit data
# -> the committed JSON drives the CF Pages build. GitHub throttles high-freq
# cron, so we ask hourly + self-loop inside the run + allow manual triggers.

on:
  schedule:
    - cron: '30 7 * * *' # once daily at 07:30 UTC = 1:00 PM IST (user request)
  workflow_dispatch:
  repository_dispatch:
    types: [tick]

permissions:
  contents: write

concurrency:
  group: mmi-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: mmi-tools-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            mmi-tools-${{ runner.os }}-

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[browser,dev]"

      - name: Install Playwright Chromium (JS fallback)
        run: python -m playwright install chromium --with-deps

      - name: Run tests
        run: python -m pytest -q

      - name: Read MMI (once daily at 1pm IST)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_BASE_URL: ${{ secrets.NTFY_BASE_URL }}
          NTFY_USER: ${{ secrets.NTFY_USER }}
          NTFY_PASSWORD: ${{ secrets.NTFY_PASSWORD }}
        run: |
          python -m mmi_watch --data data --iterations 3 --interval 60 -v

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "data: MMI read $(date -u +'%F %H:%MZ')"
            git pull --rebase --autostash origin main || true
            git push
          fi

      - name: Alert on failure (Telegram)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="⚠️ oriz-mmi scrape workflow FAILED — run ${{ github.run_id }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true
          fi
